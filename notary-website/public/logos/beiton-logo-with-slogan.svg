<svg width="600" height="120" viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg">
  <!-- 25.11.2026: הסלוגן והקו במרכז, מתחת למילה (בקשת עומר). כל הטקסטים ממורכזים על ציר אחד: BEITON ב-x=2.4 ו-BEYOND LAW ב-x=2.7 מפצים על ריווח האותיות שאחרי האות האחרונה -->
  <g transform="translate(300, 50)">
    <text text-anchor="middle" dominant-baseline="central" x="2.4" y="-10" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="44" letter-spacing="5" fill="#1a1a1a">BEITON</text>
    <line x1="-93" y1="24" x2="93" y2="24" stroke="#aaaaaa" stroke-width="0.5"/>
    <text text-anchor="middle" x="2.7" y="42" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10" letter-spacing="6" fill="#999999">BEYOND LAW</text>
  </g>
</svg>
